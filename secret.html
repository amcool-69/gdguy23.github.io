<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLICK ME!</title>

    <!-- Discord Embed / Link Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CLICK ME!">
    <meta property="og:description" content="CLICK ME!">
    <meta property="og:url" content="https://gdguy23.github.io/">
    <meta property="og:image" content="https://raw.githubusercontent.com/amcool-69/gdguy23.github.io/main/image.png">
    <meta name="theme-color" content="#7b00ff">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        body {
            border-top: 2px solid #7b00ff;
        }

        /* ORIGINAL CLICK ME BUTTON */
        #button {
            position: absolute;
            top: 24px;
            left: 25px;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
        }

        #wip {
            position: absolute;
            bottom: 24px;
            right: 25px;
            font-size: 20px;
            user-select: none;
            z-index: 1000;
        }

        /* DA HIDDEN BUTTON */
        #hiddenButton {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #7b00ff;
            background: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 2000;
        }

        #hiddenButton:hover {
            background: #f1e6ff;
        }

        /* NUMBER PAD */
        #keypad {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            padding: 15px;
            background: white;
            border: 2px solid #7b00ff;
            border-radius: 12px;
            z-index: 3000;
            text-align: center;
        }

        #display {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .key {
            width: 60px;
            height: 50px;
            margin: 4px;
            font-size: 20px;
            cursor: pointer;
        }

        /* SECRET BUTTON */
        #secretButton {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #7b00ff;
            background: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 4000;
        }

        #secretButton:hover {
            background: #f1e6ff;
        }

        /* FALLING IMAGES */
        .falling-image {
            position: fixed;
            width: 90px;
            height: auto;
            pointer-events: none;
            z-index: 1;

            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            from {
                transform: translateY(-120px);
            }

            to {
                transform: translateY(calc(100vh + 150px));
            }
        }

        /* FULLSCREEN VIDEO */
        #secretVideo {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 99999;
            background: black;
        }
    </style>
</head>

<body>

    <!-- ORIGINAL BUTTON -->
    <div id="button">CLICK ME!</div>

    <div id="wip">WIP</div>

    <!-- HIDDEN BUTTON -->
    <button id="hiddenButton">da hidden button</button>

    <!-- NUMBER PAD -->
    <div id="keypad">
        <input id="display" type="password" readonly>

        <div>
            <button class="key" data-num="1">1</button>
            <button class="key" data-num="2">2</button>
            <button class="key" data-num="3">3</button>
        </div>

        <div>
            <button class="key" data-num="4">4</button>
            <button class="key" data-num="5">5</button>
            <button class="key" data-num="6">6</button>
        </div>

        <div>
            <button class="key" data-num="7">7</button>
            <button class="key" data-num="8">8</button>
            <button class="key" data-num="9">9</button>
        </div>

        <div>
            <button class="key" id="clear">C</button>
            <button class="key" data-num="0">0</button>
            <button class="key" id="enter">✓</button>
        </div>
    </div>

    <!-- SECRET BUTTON -->
    <button id="secretButton">SECRET</button>

    <!-- SECRET VIDEO -->
    <video id="secretVideo" src="spin.mp4" playsinline></video>

    <script>
        const button = document.getElementById("button");
        const hiddenButton = document.getElementById("hiddenButton");
        const keypad = document.getElementById("keypad");
        const display = document.getElementById("display");
        const secretButton = document.getElementById("secretButton");
        const video = document.getElementById("secretVideo");

        let typed = "";
        let started = false;

        /* TYPE "PASSCODE" */
        document.addEventListener("keydown", (event) => {
            typed += event.key.toLowerCase();

            if (typed.length > 8) {
                typed = typed.slice(-8);
            }

            if (typed === "passcode") {
                hiddenButton.style.display = "block";
                typed = "";
            }
        });

        /* DA HIDDEN BUTTON */
        hiddenButton.addEventListener("click", () => {
            hiddenButton.style.display = "none";
            keypad.style.display = "block";
            display.value = "";
        });

        /* NUMBER PAD */
        document.querySelectorAll(".key[data-num]").forEach(key => {
            key.addEventListener("click", () => {
                display.value += key.dataset.num;
            });
        });

        /* CLEAR */
        document.getElementById("clear").addEventListener("click", () => {
            display.value = "";
        });

        /* ENTER CODE */
        document.getElementById("enter").addEventListener("click", () => {
            if (display.value === "2309") {
                keypad.style.display = "none";
                secretButton.style.display = "block";
            } else {
                display.value = "";
                alert("wrong code 😭");
            }
        });

        /* ORIGINAL CLICK ME IMAGE RAIN */
        function createImage() {
            const img = document.createElement("img");

            img.src = "image.png";
            img.className = "falling-image";

            img.style.left =
                Math.random() * (window.innerWidth - 100) + "px";

            const size = 70 + Math.random() * 40;
            img.style.width = size + "px";

            const duration = 7 + Math.random() * 5;
            img.style.animationDuration = duration + "s";

            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, duration * 1000 + 500);
        }

        /* ORIGINAL CLICK ME */
        button.addEventListener("click", () => {
            if (started) return;

            started = true;

            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    createImage();
                }, i * 300);
            }

            setInterval(() => {
                createImage();
            }, 700);
        });

        /* SECRET BUTTON → VIDEO */
        secretButton.addEventListener("click", () => {
            secretButton.style.display = "none";

            video.style.display = "block";
            video.currentTime = 0;
            video.play();
        });
    </script>

</body>
</html>
