/* =========================
   A1B2C3 DOT
========================= */

let dotCode = "";

let dotTimer = null;
let dotMoving = null;


document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }

    dotCode +=
        event.key.toLowerCase();


    if (
        dotCode.endsWith("a1b2c3")
    ) {

        spawnDot();

        dotCode = "";

    }


    if (dotCode.length > 6) {

        dotCode =
            dotCode.slice(-6);

    }

});


function spawnDot() {

    clearTimeout(dotTimer);
    clearInterval(dotMoving);


    dotMessage.style.display =
        "none";


    secretDot.style.display =
        "block";


    moveDot();


    dotMoving =
        setInterval(
            moveDot,
            1000
        );


    dotTimer =
        setTimeout(function() {

            secretDot.style.display =
                "none";


            clearInterval(dotMoving);


        }, 5000);

}


function moveDot() {

    const padding = 80;


    const maxX =
        window.innerWidth -
        secretDot.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        secretDot.offsetHeight -
        padding;


    const x =
        padding +
        Math.random() *
        Math.max(
            maxX - padding,
            1
        );


    const y =
        padding +
        Math.random() *
        Math.max(
            maxY - padding,
            1
        );


    secretDot.style.left =
        x + "px";


    secretDot.style.top =
        y + "px";

}


/* DOT CLICK */

});/* =========================

/* =========================
   KABOOM
========================= */

let kaboomCode = "";

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }


    kaboomCode +=
        event.key.toLowerCase();


    if (
        kaboomCode.includes("kaboom")
    ) {

        kaboomCode = "";


        document.body.style.pointerEvents =
            "none";


        const explosion =
            document.createElement("div");


        explosion.id =
            "kaboomFlash";


        document.body.appendChild(
            explosion
        );


        const elements =
            document.body.querySelectorAll(
                "body > *:not(script):not(#kaboomFlash)"
            );


        elements.forEach(function(element) {


            const x =
                (Math.random() - 0.5) *
                window.innerWidth *
                2;


            const y =
                (Math.random() - 0.5) *
                window.innerHeight *
                2;


            const rotation =
                (Math.random() - 0.5) *
                720;


            element.style.transition =
                "transform 1.2s cubic-bezier(.2,.8,.2,1), opacity 1.2s";


            element.style.transform =
                `translate(${x}px, ${y}px) rotate(${rotation}deg)`;


            element.style.opacity =
                "0";

        });


        setTimeout(function() {

            explosion.style.background =
                "black";

        }, 120);


        setTimeout(function() {

            window.location.href =
                "https://www.google.com/";

        }, 1400);

    }


    if (kaboomCode.length > 6) {

        kaboomCode =
            kaboomCode.slice(-6);

    }

});

let catGuyCode = "";

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {

    }


    catGuyCode +=
        event.key.toLowerCase();


    if (

        )
    ) {

        catGuyCode = "";


        const sound =

        sound.volume = 1.0;


        sound.play().catch(function() {});


        for (let i = 0; i < 5; i++) {

            const cat =
                document.createElement("img");


            cat.src =
                "catguy.png";


            cat.style.position =
                "fixed";


            cat.style.width =
                "180px";


            cat.style.height =
                "auto";


            cat.style.left =
                Math.random() *
                Math.max(
                    window.innerWidth - 180,
                    1
                ) +
                "px";


            cat.style.top =

                    1
                ) +

                "none";


            document.body.appendChild(

            setTimeout(function() {

    }


    if (catGuyCode.length > 18) {
