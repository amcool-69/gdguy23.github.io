<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK ME!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        body {
            border-top: 2px solid #7b00ff;
        }

        #button {
            position: absolute;
            top: 24px;
            left: 25px;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
        }

        .falling-image {
            position: fixed;
            width: 120px;
            height: auto;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-150px) rotate(0deg);
            }

            100% {
                transform: translateY(calc(100vh + 200px)) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div id="button">CLICK ME!</div>

    <script>
        const button = document.getElementById("button");

        let started = false;

        function createImage() {
            const img = document.createElement("img");

            img.src = "image.png";
            img.className = "falling-image";

            // Random horizontal position
            img.style.left =
                Math.random() * (window.innerWidth - 120) + "px";

            // Random size
            const size = 70 + Math.random() * 100;
            img.style.width = size + "px";

            // Random falling speed
            const duration = 3 + Math.random() * 5;
            img.style.animationDuration = duration + "s";

            // Random starting rotation
            img.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            document.body.appendChild(img);

            // Remove it after it falls off-screen
            setTimeout(() => {
                img.remove();
            }, duration * 1000 + 500);
        }

        button.addEventListener("click", () => {
            if (started) return;

            started = true;

            // HUGE initial burst
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    createImage();
                }, i * 25);
            }

            // Keep raining images FOREVER
            setInterval(() => {
                for (let i = 0; i < 3; i++) {
                    createImage();
                }
            }, 150);
        });
    </script>

</body>
</html>
