<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLICK ME!</title>

    <!-- Discord Embed / Link Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CLICK ME!">
    <meta property="og:description" content="CLICK ME!">
    <meta property="og:url" content="https://gdguy23.github.io/">
    <meta property="og:image" content="https://raw.githubusercontent.com/amcool-69/gdguy23.github.io/main/image.png">
    <meta name="theme-color" content="#7b00ff">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        body {
            border-top: 2px solid #7b00ff;
        }

        #button {
            position: absolute;
            top: 24px;
            left: 25px;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
        }

        #wip {
            position: absolute;
            bottom: 24px;
            right: 25px;
            font-size: 20px;
            user-select: none;
            z-index: 1000;
        }

        .falling-image {
            position: fixed;
            width: 90px;
            height: auto;
            pointer-events: none;
            z-index: 1;

            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            from {
                transform: translateY(-120px);
            }

            to {
                transform: translateY(calc(100vh + 150px));
            }
        }
    </style>
</head>

<body>

    <div id="button">CLICK ME!</div>
    <div id="wip">WIP</div>

    <script>
        const button = document.getElementById("button");

        let started = false;

        function createImage() {
            const img = document.createElement("img");

            img.src = "image.png";
            img.className = "falling-image";

            img.style.left =
                Math.random() * (window.innerWidth - 100) + "px";

            const size = 70 + Math.random() * 40;
            img.style.width = size + "px";

            const duration = 7 + Math.random() * 5;
            img.style.animationDuration = duration + "s";

            document.body.appendChild(img);

            setTimeout(() => {
                img.remove();
            }, duration * 1000 + 500);
        }

        button.addEventListener("click", () => {
            if (started) return;

            started = true;

            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    createImage();
                }, i * 300);
            }

            setInterval(() => {
                createImage();
            }, 700);
        });
    </script>

</body>
</html>
