<script>

/* =========================
   ELEMENTS
========================= */

const button = document.getElementById("button");
const wip = document.getElementById("wip");
const hiddenButton = document.getElementById("hiddenButton");
const keypad = document.getElementById("keypad");
const display = document.getElementById("display");
const secretButton = document.getElementById("secretButton");
const video = document.getElementById("secretVideo");
const ripScreen = document.getElementById("ripScreen");
const stickman = document.getElementById("stickman");
const ripText = document.getElementById("ripText");
const ripFinal = document.getElementById("ripFinal");
const secretDot = document.getElementById("secretDot");
const dotMessage = document.getElementById("dotMessage");

const bossFight = document.getElementById("bossFight");
const boss = document.getElementById("boss");
const bossAura = document.getElementById("bossAura");
const bossHealthFill = document.getElementById("bossHealthFill");
const loserScreen = document.getElementById("loserScreen");
const winScreen = document.getElementById("winScreen");

const normalKeypad = document.getElementById("normalKeypad");
const lockScreen = document.getElementById("lockScreen");
const lockCountdown = document.getElementById("lockCountdown");


/* =========================
   PASSCODE
========================= */

let typed = "";

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }

    typed += event.key.toLowerCase();

    if (typed.endsWith("passcode")) {

        hiddenButton.style.display = "block";
        typed = "";
    }

    if (typed.length > 8) {
        typed = typed.slice(-8);
    }
});


/* =========================
   PASSCODE LOCK SYSTEM
========================= */

/*
    5 incorrect codes = lockout.

    Lockout times:
    1st lock  = 1 minute
    2nd lock  = 5 minutes
    3rd lock  = 10 minutes
    4th lock  = 1 hour
    5th+ lock = 1 hour
*/

const LOCK_TIMES = [
    60 * 1000,
    5 * 60 * 1000,
    10 * 60 * 1000,
    60 * 60 * 1000
];

let wrongAttempts =
    Number(localStorage.getItem("secretSiteWrongAttempts")) || 0;

let lockLevel =
    Number(localStorage.getItem("secretSiteLockLevel")) || 0;

let keypadLockedUntil =
    Number(localStorage.getItem("secretSiteLockedUntil")) || 0;

let lockInterval = null;


function getLockDuration() {

    return LOCK_TIMES[
        Math.min(lockLevel, LOCK_TIMES.length - 1)
    ];
}


function formatTime(milliseconds) {

    const totalSeconds =
        Math.max(
            0,
            Math.ceil(milliseconds / 1000)
        );

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
        );
    }

    return (
        minutes +
        ":" +
        String(seconds).padStart(2, "0")
    );
}


function saveLockState() {

    localStorage.setItem(
        "secretSiteWrongAttempts",
        wrongAttempts
    );

    localStorage.setItem(
        "secretSiteLockLevel",
        lockLevel
    );

    localStorage.setItem(
        "secretSiteLockedUntil",
        keypadLockedUntil
    );
}


function isKeypadLocked() {

    return Date.now() < keypadLockedUntil;
}


function updateLockScreen() {

    if (!isKeypadLocked()) {

        keypad.classList.remove("locked");

        normalKeypad.style.display = "block";
        lockScreen.style.display = "none";

        clearInterval(lockInterval);
        lockInterval = null;

        keypadLockedUntil = 0;

        saveLockState();

        return;
    }

    keypad.classList.add("locked");

    normalKeypad.style.display = "none";
    lockScreen.style.display = "flex";

    const remaining =
        keypadLockedUntil - Date.now();

    lockCountdown.textContent =
        "Try again in " +
        formatTime(remaining);
}


function startKeypadLock() {

    const duration =
        getLockDuration();

    keypadLockedUntil =
        Date.now() + duration;

    wrongAttempts = 0;

    lockLevel++;

    saveLockState();

    updateLockScreen();

    clearInterval(lockInterval);

    lockInterval =
        setInterval(function() {

            updateLockScreen();

        }, 250);
}


function openKeypad() {

    hiddenButton.style.display = "none";
    keypad.style.display = "block";
    display.value = "";

    updateLockScreen();
}


hiddenButton.addEventListener("click", function() {

    openKeypad();

});


document
.querySelectorAll(".key[data-num]")
.forEach(function(key) {

    key.addEventListener("click", function() {

        if (isKeypadLocked()) {
            return;
        }

        display.value += key.dataset.num;
    });
});


document
.getElementById("clear")
.addEventListener("click", function() {

    if (isKeypadLocked()) {
        return;
    }

    display.value = "";
});


document
.getElementById("enter")
.addEventListener("click", function() {

    if (isKeypadLocked()) {
        updateLockScreen();
        return;
    }

    if (display.value === "2309") {

        keypad.style.display = "none";

        secretButton.style.display = "block";

        /* Successful code resets the wrong-attempt counter. */
        wrongAttempts = 0;

        saveLockState();

    } else {

        wrongAttempts++;

        display.value = "";

        saveLockState();

        if (wrongAttempts >= 5) {

            startKeypadLock();

        } else {

            alert(
                "wrong code 😭\n\n" +
                "Incorrect attempts: " +
                wrongAttempts +
                "/5"
            );
        }
    }
});


/* Restore an active lock if the page was refreshed. */

if (isKeypadLocked()) {

    keypad.style.display = "block";

    updateLockScreen();

}


/* =========================
   IMAGE RAIN
========================= */

let started = false;

function createImage() {

    const img = document.createElement("img");

    img.src = "image.png";
    img.className = "falling-image";

    img.style.left =
        Math.random() *
        Math.max(window.innerWidth - 100, 1) +
        "px";

    const size =
        70 + Math.random() * 40;

    img.style.width =
        size + "px";

    const duration =
        7 + Math.random() * 5;

    img.style.animationDuration =
        duration + "s";

    document.body.appendChild(img);

    setTimeout(function() {

        img.remove();

    }, duration * 1000 + 500);
}


/* =========================
   SECRET STATE
========================= */

let noCount = 0;
let noCode = "";

let angryMode = false;
let cursorGone = false;


/* =========================
   NORMAL CLICK ME
========================= */

button.addEventListener("click", function() {

    if (noCount === 1) {

        if (angryMode) {
            return;
        }

        angryMode = true;

        for (let i = 0; i < 5; i++) {

            const angry =
                document.createElement("img");

            angry.src = "angry.png";
            angry.className = "angry-image";

            angry.style.position = "fixed";
            angry.style.width = "120px";
            angry.style.height = "auto";

            angry.style.left =
                Math.random() *
                Math.max(window.innerWidth - 120, 1) +
                "px";

            angry.style.top =
                Math.random() *
                Math.max(window.innerHeight - 120, 1) +
                "px";

            angry.style.zIndex = "99990";
            angry.style.pointerEvents = "none";

            document.body.appendChild(angry);

            chaseAngry(angry);
        }

        return;
    }


    if (noCount === 2) {

        const creepy =
            document.createElement("img");

        creepy.src = "creepy.png";

        creepy.style.position = "fixed";
        creepy.style.left = "50%";
        creepy.style.top = "50%";
        creepy.style.transform = "translate(-50%, -50%)";
        creepy.style.width = "min(500px, 80vw)";
        creepy.style.maxHeight = "80vh";
        creepy.style.objectFit = "contain";
        creepy.style.zIndex = "999999";
        creepy.style.pointerEvents = "none";

        document.body.appendChild(creepy);

        const scream =
            new Audio("scream.mp3");

        scream.volume = 1.0;
        scream.play().catch(function() {});

        document.body.style.background = "white";

        setTimeout(function() {
            document.body.style.background = "black";
        }, 80);

        setTimeout(function() {
            creepy.remove();
        }, 4000);

        return;
    }


    if (started) {
        return;
    }

    started = true;

    for (let i = 0; i < 10; i++) {

        setTimeout(function() {
            createImage();
        }, i * 300);
    }

    setInterval(function() {
        createImage();
    }, 700);
});


/* =========================
   NO SECRET
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }

    noCode += event.key.toLowerCase();

    if (noCode.endsWith("no")) {

        noCount++;
        noCode = "";

        if (noCount === 1) {
            button.textContent = "Click Me?";
        }

        else if (noCount === 2) {
            button.textContent = "DON'T CLICK ME";
        }   unlockAchievement("no");
    }

    if (noCode.length > 2) {

/* =========================
   ANGRY CHASE
========================= */

let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;

document.addEventListener("mousemove", function(event) {

    mouseX = event.clientX;
    mouseY = event.clientY;
});


function chaseAngry(element) {

    let x =
        parseFloat(element.style.left);

    let y =
        parseFloat(element.style.top);

    function move() {

        if (!element.isConnected) {
            return;
        }

        const rect =
            element.getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        const dx =
            mouseX - centerX;

        const dy =
            mouseY - centerY;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance > 2) {

            x +=
                (dx / distance) * 2.5;

            y +=
                (dy / distance) * 2.5;

            element.style.left = x + "px";
            element.style.top = y + "px";
        }

        if (
            distance < 65 &&
            !cursorGone
        ) {

            cursorGone = true;

            document.body.style.cursor = "none";
            document.documentElement.style.cursor = "none";

            document
            .querySelectorAll("*")
            .forEach(function(el) {
                el.style.cursor = "none";
            });
        }

        requestAnimationFrame(move);
    }

    move();
}

/* =========================
   FIRE BOSS BEAM
========================= */

function fireBossBeam() {

    if (
        !bossActive ||
        bossDead
    ) {
        return;
    }

    boss.src = "shoot.png";

    const bossRect =
        boss.getBoundingClientRect();

    const startX =
        bossRect.left +
        bossRect.width / 2;

    const startY =
        bossRect.top +
        bossRect.height / 2;

    const length =
        Math.sqrt(
            window.innerWidth *
            window.innerWidth +
            window.innerHeight *
            window.innerHeight
        ) * 2;

    const beam =
        document.createElement("div");

    beam.className =
        "boss-beam fire";

    beam.style.left =
        startX + "px";

    beam.style.top =
        startY + "px";

    beam.style.width =
        length + "px";

    beam.style.transform =
        `rotate(${bossAngle}rad)`;

    bossFight.appendChild(beam);

    setTimeout(function() {
        boss.src = "neutral.png";
    }, 16);


    if (
        pointHitsBeam(
            bossMouseX,
            bossMouseY,
            startX,
            startY,
            bossAngle
        )
    ) {

        loseBossFight();
        return;
    }


    const collisionCheck =
        setInterval(function() {

            if (
                !bossActive ||
                bossDead ||
                !beam.isConnected
            ) {

                clearInterval(collisionCheck);
                return;
            }

            if (
                pointHitsBeam(
                    bossMouseX,
                    bossMouseY,
                    startX,
                    startY,
                    bossAngle
                )
            ) {

                clearInterval(collisionCheck);
                loseBossFight();
            }

        }, 10);


    setTimeout(function() {

        clearInterval(collisionCheck);
        beam.remove();

    }, 180);


    bossShotTimeout =
        setTimeout(function() {

            chooseBossShot();

        }, 900);
}


/* =========================
   BEAM COLLISION
========================= */

function pointHitsBeam(
    px,
    py,
    x1,
    y1,
    angle
) {

    const dx =
        Math.cos(angle);

    const dy =
        Math.sin(angle);

    const vx =
        px - x1;

    const vy =
        py - y1;

    const projection =
        vx * dx +
        vy * dy;

    if (projection < 0) {
        return false;
    }

    const closestX =
        x1 +
        dx * projection;

    const closestY =
        y1 +
        dy * projection;

    const distance =
        Math.sqrt(
            Math.pow(px - closestX, 2) +
            Math.pow(py - closestY, 2)
        );

    return distance < 13;
}


/* =========================
   PLAYER SHOOT
========================= */

bossFight.addEventListener(
    "click",
    function(event) {

        if (
            !bossActive ||
            bossDead
        ) {
            return;
        }

        /* COOLDOWN CHECK */

        if (!playerShotReady) {
            return;
        }

        /* START COOLDOWN */

        playerShotReady = false;

        setTimeout(function() {

            playerShotReady = true;

        }, PLAYER_SHOT_COOLDOWN);


        const bossRect =
            boss.getBoundingClientRect();

        const bossX =
            bossRect.left +
            bossRect.width / 2;

        const bossY =
            bossRect.top +
            bossRect.height / 2;

        const dx =
            bossX -
            event.clientX;

        const dy =
            bossY -
            event.clientY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const angle =
            Math.atan2(dy, dx);

        const beam =
            document.createElement("div");

        beam.className =
            "player-beam";

        beam.style.left =
            event.clientX + "px";

        beam.style.top =
            event.clientY + "px";

        beam.style.width =
            distance + "px";

        beam.style.transform =
            `rotate(${angle}rad)`;

        bossFight.appendChild(beam);

        bossHP--;

        bossHealthFill.style.width =
            (bossHP / 5 * 100) + "%";

        setTimeout(function() {

            beam.remove();

        }, 120);

        if (bossHP <= 0) {
            defeatBoss();
        }
    }
);

   LOSE
========================= */

function loseBossFight() {

    if (
        !bossActive ||
        bossDead
    ) {
        return;
    }

    bossActive = false;

    clearTimeout(bossShotTimeout);
    clearTimeout(bossPowerTimeout);

    bossFight.style.display = "none";

    loserScreen.style.display = "flex";

    document.body.style.cursor = "default";
}

========================= */

function defeatBoss() {

    if (
        !bossActive ||
        bossDead
    ) {
        return;
    }

    bossDead = true;
    bossActive = false;

    clearTimeout(bossShotTimeout);
    clearTimeout(bossPowerTimeout);

    bossHealthFill.style.width = "0%";

    bossFight.style.display = "none";

    winScreen.style.display = "flex";

    document.body.style.cursor = "default";
}
