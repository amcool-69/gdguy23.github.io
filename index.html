<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK ME!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        body {
            border-top: 2px solid #7b00ff;
        }

        #button {
            position: absolute;
            top: 24px;
            left: 25px;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="button">CLICK ME!</div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const button = document.getElementById("button");

        const image = new Image();

        // Your image file
        image.src = "image.png";

        let pieces = [];
        let started = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", resize);
        resize();

        class Piece {
            constructor(x, y) {
                this.x = x;
                this.y = y;

                this.sx = Math.random() * image.width;
                this.sy = Math.random() * image.height;

                this.sw = 25 + Math.random() * 55;
                this.sh = 25 + Math.random() * 55;

                this.size = 20 + Math.random() * 45;

                this.vx = (Math.random() - 0.5) * 14;
                this.vy = -Math.random() * 12 - 2;

                this.gravity = 0.08 + Math.random() * 0.12;

                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed =
                    (Math.random() - 0.5) * 0.15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                this.vy += this.gravity;
                this.vx *= 0.995;

                this.rotation += this.rotationSpeed;

                // Reappear at the top forever
                if (this.y > canvas.height + 100) {
                    this.y = -100;
                    this.x = Math.random() * canvas.width;

                    this.vy = Math.random() * 3 + 1;
                    this.vx = (Math.random() - 0.5) * 4;
                }
            }

            draw() {
                ctx.save();

                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.drawImage(
                    image,
                    this.sx,
                    this.sy,
                    this.sw,
                    this.sh,
                    -this.size / 2,
                    -this.size / 2,
                    this.size,
                    this.size
                );

                ctx.restore();
            }
        }

        function createConfetti() {
            // BIG initial explosion
            for (let i = 0; i < 250; i++) {
                pieces.push(
                    new Piece(
                        window.innerWidth / 2,
                        window.innerHeight / 2
                    )
                );
            }

            // Keep spawning pieces forever
            setInterval(() => {
                for (let i = 0; i < 8; i++) {
                    pieces.push(
                        new Piece(
                            Math.random() * canvas.width,
                            -50
                        )
                    );
                }
            }, 100);

            started = true;
        }

        function animate() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            for (const piece of pieces) {
                piece.update();
                piece.draw();
            }

            requestAnimationFrame(animate);
        }

        button.addEventListener("click", () => {
            if (!started) {
                createConfetti();
                animate();
            }
        });
    </script>

</body>
</html>
