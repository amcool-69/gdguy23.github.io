/* =========================

let noCount = 0;

/* =========================

button.addEventListener("click", function() {

    if (noCount === 1) {

        if (angryMode) {
            return;
        }

        angryMode = true;

        for (let i = 0; i < 5; i++) {

            const angry =

    if (started) {

    started = true;

        setTimeout(function() {

            createImage();

        }, i * 300);
    }

    setInterval(function() {

});


/* =========================
   NO SECRET
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;

/* =========================
   ANGRY CHASE
========================= */

let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;


document.addEventListener("mousemove", function(event) {

    mouseX = event.clientX;
    mouseY = event.clientY;
});


function chaseAngry(element) {

    let x =
        parseFloat(element.style.left);

    let y =
        parseFloat(element.style.top);

    function move() {

        if (!element.isConnected) {
            return;
        }

        const rect =
            element.getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        const dx =
            mouseX - centerX;

        const dy =
            mouseY - centerY;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance > 2) {

            x +=
                (dx / distance) * 2.5;

            y +=
                (dy / distance) * 2.5;

            element.style.left =
                x + "px";

            element.style.top =
                y + "px";
        }


        if (
            distance < 65 &&
            !cursorGone
        ) {

            cursorGone = true;

            document.body.style.cursor =
                "none";

            document.documentElement.style.cursor =
                "none";

            document
            .querySelectorAll("*")
            .forEach(function(el) {

                el.style.cursor =
                    "none";
            });
        }

        requestAnimationFrame(move);
    }

    move();
}

let dotCode = "";

let dotTimer = null;
let dotMoving = null;


document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }

    dotCode +=
        event.key.toLowerCase();

    if (
        dotCode.endsWith("a1b2c3")

        dotCode = "";

    if (dotCode.length > 6) {
        dotCode =

});


function spawnDot() {

    clearTimeout(dotTimer);
    clearInterval(dotMoving);

    dotMessage.style.display =
        "none";

    secretDot.style.display =
        "block";

    moveDot();

    dotMoving =
        setInterval(
            moveDot,
            1000
        );

    dotTimer =
        setTimeout(function() {

            secretDot.style.display =
                "none";

            clearInterval(dotMoving);

        }, 5000);
}


function moveDot() {

    const padding = 80;

    const maxX =
        window.innerWidth -
        secretDot.offsetWidth -
        padding;

    const maxY =
        window.innerHeight -
        secretDot.offsetHeight -
        padding;

    const x =
        padding +
        Math.random() *
        Math.max(
            maxX - padding,
            1
        );

    const y =
        padding +
        Math.random() *
        Math.max(
            maxY - padding,
            1
        );

    secretDot.style.left =
        x + "px";

    secretDot.style.top =
        y + "px";
}

        "none";

    );

    setTimeout(function() {

        dotMessage.style.display =
            "none";

    }, 3000);
});


/* =================================================
   BOSS FIGHT
================================================= */

const bossFight =
    document.getElementById("bossFight");

const boss =
    document.getElementById("boss");

const bossHealth =
    document.getElementById("bossHealth");

const bossLoser =
    document.getElementById("bossLoser");

const bossWinner =
    document.getElementById("bossWinner");


let bossActive = false;
let bossDead = false;
let bossHealthValue = 100;

let bossShotTimer = null;
let bossBeamTimer = null;


/* BOSS KEYWORD */

let bossCode = "";

document.addEventListener("keydown", function(event) {

    if (event.key.length !== 1) {
        return;
    }

    bossCode +=
        event.key.toLowerCase();

    if (
        bossCode.endsWith("bossfight")
    ) {

        bossCode = "";

        startBossFight();

        return;
    }

    if (bossCode.length > 9) {
        bossCode =
            bossCode.slice(-9);
    }
});


/* START BOSS */

function startBossFight() {

    if (bossActive) {
        return;
    }

    bossActive = true;
    bossDead = false;
    bossHealthValue = 100;

    bossHealth.style.width =
        "100%";

    bossLoser.style.display =
        "none";

    bossWinner.style.display =
        "none";

    bossFight.style.display =
        "block";

    boss.src =
        "neutral.png";

    scheduleBossShot();
}


/* BOSS SHOOTING */

function scheduleBossShot() {

    if (!bossActive || bossDead) {
        return;
    }

    const delay =
        1000 + Math.random() * 1800;

    bossShotTimer =
        setTimeout(function() {

            bossShoot();

        }, delay);
}


/*
    The boss chooses the beam's Y position
    BEFORE charging.

    Once charging starts, that position
    cannot change.
*/

function bossShoot() {

    if (!bossActive || bossDead) {
        return;
    }

    const bossRect =
        boss.getBoundingClientRect();

    const bossCenterX =
        bossRect.left +
        bossRect.width / 2;

    const bossCenterY =
        bossRect.top +
        bossRect.height / 2;

    const targetY =
        40 +
        Math.random() *
        Math.max(
            window.innerHeight - 80,
            1
        );


    boss.src =
        "shoot.png";

    boss.classList.add(
        "charging"
    );


    /*
        Keep the chosen targetY locked.
    */

    bossBeamTimer =
        setTimeout(function() {

            boss.classList.remove(
                "charging"
            );

            boss.classList.add(
                "shooting"
            );

            createBossBeam(
                bossCenterX,
                bossCenterY,
                targetY
            );


            setTimeout(function() {

                boss.classList.remove(
                    "shooting"
                );

                boss.src =
                    "neutral.png";

            }, 1);


        }, 750);


    setTimeout(function() {

        scheduleBossShot();

    }, 1000);
}


/* CREATE BOSS BEAM */

function createBossBeam(
    startX,
    startY,
    targetY
) {

    if (!bossActive || bossDead) {
        return;
    }

    const beam =
        document.createElement("div");

    beam.className =
        "boss-beam";

    /*
        Beam travels horizontally
        from the boss toward the right side.
    */

    beam.style.left =
        startX + "px";

    beam.style.top =
        (targetY - 5) + "px";

    beam.style.width =
        Math.max(
            window.innerWidth - startX,
            1
        ) + "px";

    document
    .getElementById("bossFight")
    .appendChild(beam);


    /*
        Collision is checked while the
        beam is active.
    */

    const collisionStart =
        performance.now();

    function checkCollision() {

        if (
            !bossActive ||
            bossDead ||
            !beam.isConnected
        ) {
            return;
        }

        const elapsed =
            performance.now() -
            collisionStart;

        const mouseDistance =
            Math.abs(
                mouseY -
                targetY
            );


        /*
            The beam lasts about 180ms.
            The mouse must be away from
            the beam's Y position.
        */

        if (
            elapsed < 180 &&
            mouseDistance < 12
        ) {

            loseBossFight();

            return;
        }


        if (elapsed < 180) {

            requestAnimationFrame(
                checkCollision
            );

        } else {

            beam.remove();
        }
    }

    requestAnimationFrame(
        checkCollision
    );
}


/* PLAYER SHOOT */

bossFight.addEventListener(
    "click",
    function(event) {

        if (
            !bossActive ||
            bossDead
        ) {
            return;
        }

        /*
            Clicking anywhere shoots a
            horizontal white beam toward
            the boss.
        */

        const bossRect =
            boss.getBoundingClientRect();

        const bossCenterX =
            bossRect.left +
            bossRect.width / 2;

        const bossCenterY =
            bossRect.top +
            bossRect.height / 2;

        const dx =
            bossCenterX -
            event.clientX;

        const dy =
            bossCenterY -
            event.clientY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const angle =
            Math.atan2(
                dy,
                dx
            );

        const beam =
            document.createElement("div");

        beam.className =
            "player-beam";

        beam.style.left =
            event.clientX + "px";

        beam.style.top =
            (event.clientY - 3) + "px";

        beam.style.width =
            distance + "px";

        beam.style.transform =
            "rotate(" +
            angle +
            "rad)";

        bossFight.appendChild(
            beam
        );


        /*
            The player's beam damages
            the boss if it reaches it.
        */

        if (
            Math.abs(
                event.clientX -
                bossCenterX
            ) < 220 &&
            Math.abs(
                event.clientY -
                bossCenterY
            ) < 220
        ) {

            damageBoss();

        }


        setTimeout(function() {

            beam.remove();

        }, 100);
    }
);


/* DAMAGE BOSS */

function damageBoss() {

    if (
        !bossActive ||
        bossDead
    ) {
        return;
    }

    bossHealthValue -= 10;

    bossHealthValue =
        Math.max(
            bossHealthValue,
            0
        );

    bossHealth.style.width =
        bossHealthValue + "%";


    if (
        bossHealthValue <= 0
    ) {

        winBossFight();

    }
}


/* LOSE */

function loseBossFight() {

    if (
        bossDead
    ) {
        return;
    }

    bossDead = true;
    bossActive = false;

    clearTimeout(
        bossShotTimer
    );

    clearTimeout(
        bossBeamTimer
    );

    bossLoser.style.display =
        "flex";
}


/* WIN */

function winBossFight() {

    if (
        bossDead
    ) {
        return;
    }

    bossDead = true;
    bossActive = false;

    clearTimeout(
        bossShotTimer
    );

    clearTimeout(
        bossBeamTimer
    );

    bossWinner.style.display =
        "flex";
}

</script>

</body>
</html>
